name: Email changelog from README (pretty text)

on:
  workflow_run:
    # ✅ Must match the exact `name:` of your update workflow
    workflows: ["Update standards versions"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    # ✅ Send only when the update workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract latest changelog section from README (pretty text)
        id: extract
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          python3 - << 'PY'
          import re
          from pathlib import Path
          import os
          import subprocess
          from datetime import datetime, timezone, timedelta

          def extract_latest_date_from_readme(text):
              """README.md 텍스트에서 최신 날짜 블록의 날짜를 추출"""
              m = re.search(r"^##\s*변경\s*내역\s*$([\s\S]*)", text, re.MULTILINE)
              if not m:
                  return None
              
              changelog = m.group(1).strip()
              block_re = re.compile(
                  r"^###\s*(\d{4}-\d{2}-\d{2})\s*$",
                  re.MULTILINE
              )
              blocks = list(block_re.finditer(changelog))
              if not blocks:
                  return None
              
              return blocks[0].group(1)

          # (KST) 날짜 계산
          KST = timezone(timedelta(hours=9))
          today_kst = datetime.now(KST).strftime("%Y-%m-%d")

          # 1) 오늘 이미 메일을 보냈는지 확인
          try:
              result = subprocess.run(
                  ["git", "log", "origin/main", f"--grep=^chore: email sent on {today_kst}$", 
                   "--format=%H", "-n", "1"],
                  capture_output=True,
                  text=True,
                  check=True
              )
              already_sent_today = bool(result.stdout.strip())
          except Exception as e:
              print(f"Warning: Could not check email sent status: {e}")
              already_sent_today = False

          print(f"Today (KST): {today_kst}")
          print(f"Already sent today: {already_sent_today}")

          if already_sent_today:
              print(f"Email already sent today ({today_kst}). Skipping.")
              Path("has_changes.txt").write_text("0", encoding="utf-8")
              Path("latest_date.txt").write_text(today_kst + "\n", encoding="utf-8")
              Path("latest_changelog_pretty.txt").write_text("", encoding="utf-8")
              exit(0)

          # 2) README.md 읽기 및 최신 날짜 확인
          text = Path("README.md").read_text(encoding="utf-8")
          latest_date = extract_latest_date_from_readme(text)

          print(f"README latest date: {latest_date}")

          # 3) 변경사항 확인 및 메일 내용 생성
          if latest_date and latest_date == today_kst:
              # 오늘 날짜 블록이 있음 → 변경사항 있음
              print("Status: Changes detected (today's date block exists)")
              
              m = re.search(r"^##\s*변경\s*내역\s*$([\s\S]*)", text, re.MULTILINE)
              changelog = m.group(1).strip()
              
              block_re = re.compile(
                  r"^###\s*(\d{4}-\d{2}-\d{2})\s*$"
                  r"([\s\S]*?)"
                  r"(?=^###\s*\d{4}-\d{2}-\d{2}\s*$|\Z)",
                  re.MULTILINE
              )
              blocks = list(block_re.finditer(changelog))
              latest_block = blocks[0]
              block_content = latest_block.group(2) or ""

              bullet_lines = []
              for ln in block_content.splitlines():
                  ln = ln.strip()
                  if ln.startswith("- ") and not ln.startswith("- ####"):
                      bullet_lines.append(ln[2:].strip())

              pretty_items = [f"• {b}" for b in bullet_lines if b]
              
              if not pretty_items:
                  pretty_items = ["• 변경사항이 없습니다"]
          else:
              # 오늘 날짜 블록이 없음 → 변경사항 없음
              print("Status: No changes (no today's date block)")
              pretty_items = ["• 변경사항이 없습니다"]

          # 4) 링크 구성
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          repo_url = f"{server_url}/{repo}" if repo else server_url
          readme_url = f"{server_url}/{repo}/blob/main/README.md" if repo else ""
          csv_url = f"{server_url}/{repo}/blob/main/standards.csv" if repo else ""

          # 5) 최종 텍스트 본문 생성
          out = []
          out.append("표준 문서 변경 알림")
          out.append("")
          out.append(f"날짜: {today_kst}")
          out.append("")
          out.append("변경 내역:")
          out.extend(pretty_items)
          out.append("")
          out.append("바로가기:")
          if repo_url:
              out.append(f"- 저장소: {repo_url}")
          if readme_url:
              out.append(f"- README: {readme_url}")
          if csv_url:
              out.append(f"- CSV: {csv_url}")

          pretty_text = "\n".join(out) + "\n"

          Path("latest_changelog_pretty.txt").write_text(pretty_text, encoding="utf-8")
          Path("latest_date.txt").write_text(today_kst + "\n", encoding="utf-8")
          
          # ✅ 오늘 처음 실행이면 항상 메일 발송
          Path("has_changes.txt").write_text("1", encoding="utf-8")

          print("Has changes: 1 (will send email)")
          PY

      - name: Check if there are changes
        id: check_changes
        run: |
          HAS_CHANGES=$(cat has_changes.txt)
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          if [ "$HAS_CHANGES" = "0" ]; then
            echo "No changes detected. Skipping email notification."
            exit 0
          fi

      - name: Read extracted text
        id: readtxt
        if: steps.check_changes.outputs.has_changes == '1'
        run: |
          echo "LATEST_DATE=$(cat latest_date.txt)" >> $GITHUB_ENV
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat latest_changelog_pretty.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send email
        if: steps.check_changes.outputs.has_changes == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "표준 문서 변경 알림 (${{ env.LATEST_DATE }})"
          to: ${{ secrets.MAIL_TO }}
          from: "standards-version-tracker <${{ secrets.SMTP_USERNAME }}>"
          body: |
            ${{ env.CHANGELOG }}

      - name: Record email sent
        if: steps.check_changes.outputs.has_changes == '1'
        run: |
          TODAY=$(cat latest_date.txt | tr -d '\n')
          git config user.name "standards-bot"
          git config user.email "standards-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: email sent on $TODAY"
          git push