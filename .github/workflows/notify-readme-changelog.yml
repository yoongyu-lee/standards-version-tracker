name: Email changelog from README (pretty text)

on:
  workflow_run:
    # ✅ Must match the exact `name:` of your update workflow
    workflows: ["Update standards versions"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    # ✅ Send only when the update workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract latest changelog section from README (pretty text)
        id: extract
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          python3 - << 'PY'
          import re
          from pathlib import Path
          import os
          import subprocess
          from datetime import datetime, timezone, timedelta

          def extract_latest_date_from_readme(text):
              """README.md 텍스트에서 최신 날짜 블록의 날짜를 추출"""
              m = re.search(r"^##\s*변경\s*내역\s*$([\s\S]*)", text, re.MULTILINE)
              if not m:
                  return None
              
              changelog = m.group(1).strip()
              block_re = re.compile(
                  r"^###\s*(\d{4}-\d{2}-\d{2})\s*$",
                  re.MULTILINE
              )
              blocks = list(block_re.finditer(changelog))
              if not blocks:
                  return None
              
              return blocks[0].group(1)

          # 현재 README.md 읽기
          text = Path("README.md").read_text(encoding="utf-8")

          # (KST) 날짜 표기 보정용
          KST = timezone(timedelta(hours=9))
          today_kst = datetime.now(KST).strftime("%Y-%m-%d")

          # 1) 현재 README.md에서 최신 날짜 추출
          current_latest_date = extract_latest_date_from_readme(text)

          # 2) 이전 발송 날짜 확인 (Git 커밋 히스토리 활용)
          previous_sent_date = None
          try:
              # 마지막 "chore: update standards versions" 커밋 찾기
              result = subprocess.run(
                  ["git", "log", "--all", "--grep=^chore: update standards versions$", 
                   "--format=%H", "-n", "1"],
                  capture_output=True,
                  text=True,
                  check=True
              )
              last_commit = result.stdout.strip()
              
              if last_commit:
                  # 해당 커밋의 README.md 내용 가져오기
                  result = subprocess.run(
                      ["git", "show", f"{last_commit}:README.md"],
                      capture_output=True,
                      text=True,
                      check=True
                  )
                  previous_readme = result.stdout
                  previous_sent_date = extract_latest_date_from_readme(previous_readme)
          except Exception as e:
              print(f"Warning: Could not get previous sent date: {e}")

          print(f"Previous sent date: {previous_sent_date}")
          print(f"Current latest date: {current_latest_date}")

          # 3) 새로운 변경사항이 있는지 확인
          is_new_change = False
          if current_latest_date is None:
              latest_date = "NO_CHANGE"
              pretty_items = []
          elif previous_sent_date is None:
              # 이전 발송 기록이 없으면 발송
              is_new_change = True
              latest_date = current_latest_date
          elif current_latest_date != previous_sent_date:
              # 날짜가 다르면 새로운 변경사항
              is_new_change = True
              latest_date = current_latest_date
          else:
              # 날짜가 같으면 이미 발송함
              latest_date = current_latest_date
              is_new_change = False

          # 4) 새로운 변경사항이 있을 때만 내용 추출
          if is_new_change and latest_date != "NO_CHANGE":
              m = re.search(r"^##\s*변경\s*내역\s*$([\s\S]*)", text, re.MULTILINE)
              changelog = m.group(1).strip()
              
              block_re = re.compile(
                  r"^###\s*(\d{4}-\d{2}-\d{2})\s*$"
                  r"([\s\S]*?)"
                  r"(?=^###\s*\d{4}-\d{2}-\d{2}\s*$|\Z)",
                  re.MULTILINE
              )
              blocks = list(block_re.finditer(changelog))
              latest = blocks[0]
              block_content = latest.group(2) or ""

              bullet_lines = []
              for ln in block_content.splitlines():
                  ln = ln.strip()
                  if ln.startswith("- ") and not ln.startswith("- ####"):
                      bullet_lines.append(ln[2:].strip())

              pretty_items = [f"• {b}" for b in bullet_lines if b]
          else:
              pretty_items = []

          # 5) 링크 구성
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          repo_url = f"{server_url}/{repo}" if repo else server_url
          readme_url = f"{server_url}/{repo}/blob/main/README.md" if repo else ""
          csv_url = f"{server_url}/{repo}/blob/main/standards.csv" if repo else ""

          # 6) 최종 텍스트 본문 생성 (Markdown 없이)
          out = []
          out.append("표준 문서 변경 알림")
          out.append("")

          if latest_date == "NO_CHANGE":
              out.append(f"날짜: {today_kst} (변경내역 없음)")
          else:
              out.append(f"날짜: {latest_date}")

          out.append("")
          out.append("변경 내역:")

          if pretty_items:
              out.extend(pretty_items)
          else:
              out.append("• 변경내역 없음")

          out.append("")
          out.append("바로가기:")
          if repo_url:
              out.append(f"- 저장소: {repo_url}")
          if readme_url:
              out.append(f"- README: {readme_url}")
          if csv_url:
              out.append(f"- CSV: {csv_url}")

          pretty_text = "\n".join(out) + "\n"

          Path("latest_changelog_pretty.txt").write_text(pretty_text, encoding="utf-8")
          Path("latest_date.txt").write_text(latest_date + "\n", encoding="utf-8")
          
          # ✅ 새로운 변경사항이 있고, 내용이 있을 때만 has_changes=1
          has_changes = "1" if (is_new_change and latest_date != "NO_CHANGE" and pretty_items) else "0"
          Path("has_changes.txt").write_text(has_changes, encoding="utf-8")

          print("Latest changelog date:", latest_date)
          print("Is new change:", is_new_change)
          print("Has changes:", has_changes)
          PY

      - name: Check if there are changes
        id: check_changes
        run: |
          HAS_CHANGES=$(cat has_changes.txt)
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          if [ "$HAS_CHANGES" = "0" ]; then
            echo "No changes detected. Skipping email notification."
            exit 0
          fi

      - name: Read extracted text
        id: readtxt
        if: steps.check_changes.outputs.has_changes == '1'
        run: |
          echo "LATEST_DATE=$(cat latest_date.txt)" >> $GITHUB_ENV
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat latest_changelog_pretty.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send email
        if: steps.check_changes.outputs.has_changes == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "표준 문서 변경 알림 (${{ env.LATEST_DATE }})"
          to: ${{ secrets.MAIL_TO }}
          from: "standards-version-tracker <${{ secrets.SMTP_USERNAME }}>"
          body: |
            ${{ env.CHANGELOG }}